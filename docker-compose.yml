# docker compose up --build   ->  http://localhost:8000
#
# Three services:
#   db           PostgreSQL 16 on a named volume
#   judge-image  builds algoarena-judge:latest and exits (the image the Docker runner uses)
#   api          Node.js (Express, ws, Prisma) + the built web app
#
# The api mounts the Docker socket so it can start a locked-down sibling container
# per submission. Anything that can reach that socket is root on the host: see the
# security note in README.md. To avoid the socket, set JUDGE_BACKEND=judge0 and
# JUDGE0_URL, and delete the socket volume line.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: algoarena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algoarena}
      POSTGRES_DB: algoarena
    volumes:
      - algoarena-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoarena -d algoarena"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  judge-image:
    build:
      context: ./server/src/judge/harness
      dockerfile: Dockerfile.judge
    image: algoarena-judge:latest
    command: ["true"]
    restart: "no"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      judge-image:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql://algoarena:${POSTGRES_PASSWORD:-algoarena}@db:5432/algoarena
      JUDGE_BACKEND: ${JUDGE_BACKEND:-docker}
      JUDGE_IMAGE: algoarena-judge:latest
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  algoarena-pg:

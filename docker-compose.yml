# docker compose up --build   ->  http://localhost:8000
#
# Two services:
#   judge-image  builds algoarena-judge:latest and exits (the image DockerRunner uses)
#   api          FastAPI + the built web app, SQLite on a named volume
#
# The api mounts the Docker socket so it can start a locked-down sibling container
# per submission. Anything that can reach that socket is root on the host: see the
# security note in README.md. To avoid the socket, set JUDGE_BACKEND=judge0 and
# JUDGE0_URL, and delete the socket volume line.
services:
  judge-image:
    build:
      context: ./backend/app/judge
      dockerfile: Dockerfile.judge
    image: algoarena-judge:latest
    command: ["true"]
    restart: "no"

  api:
    build: .
    depends_on:
      judge-image:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/algoarena.db}
      JUDGE_BACKEND: ${JUDGE_BACKEND:-docker}
      JUDGE_IMAGE: algoarena-judge:latest
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    volumes:
      - algoarena-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  algoarena-data:

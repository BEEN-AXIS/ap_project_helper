[project]
name = "algoarena-backend"
version = "1.0.0"
description = "AlgoArena: server-authoritative 1v1 coding battles"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlmodel>=0.0.22",
  "SQLAlchemy>=2.0.36",
  "pydantic>=2.9",
  "uvicorn>=0.32",
  "PyJWT>=2.9",
  "cryptography>=44",          # Argon2id lives in cryptography >= 44
  "psutil>=6.0",               # memory polling in the judge harness (macOS ignores RLIMIT_AS)
  "httpx>=0.27",               # Judge0Runner and the API tests
  "alembic>=1.14",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.115",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-audit>=2.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.domain.*"
strict = true
